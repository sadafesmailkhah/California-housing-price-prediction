[project]
name = "housing"
version = "0.1.0"
description = "California housing price prediction project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "jupyter",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]